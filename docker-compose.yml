# Local full-stack orchestration: MongoDB + backend API.
# The client & admin run separately (npm run dev) or deploy to Vercel/Netlify.
#
#   docker compose up --build
#
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./ecommerce-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/ecommerce
      CLIENT_URL: http://localhost:3000
      ADMIN_URL: http://localhost:5173
    env_file:
      - ./ecommerce-backend/.env

volumes:
  mongo_data:
